name: Build & Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Build for Simulator (Verification)
        run: |
          xcodebuild -project ios/RTSPCamera.xcodeproj \
            -scheme RTSPCamera \
            -sdk iphonesimulator \
            -configuration Debug \
            build > /tmp/build.log 2>&1 || {
              echo "=== BUILD ERRORS ==="
              grep -E "\.swift:[0-9]+:[0-9]+: error:" /tmp/build.log || grep -E "error:" /tmp/build.log
              echo "=== LAST 40 LINES ==="
              tail -40 /tmp/build.log
              exit 1
            }

      - name: Build for Device (Unsigned Release)
        run: |
          xcodebuild -project ios/RTSPCamera.xcodeproj \
            -scheme RTSPCamera \
            -sdk iphoneos \
            -configuration Release \
            SYMROOT=$GITHUB_WORKSPACE/ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          cd ios/build
          mkdir -p Payload
          cp -r Release-iphoneos/RTSPCamera.app Payload/
          zip -r RTSPCamera-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/build/RTSPCamera-unsigned.ipa

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk

  release:
    name: Create Release
    needs: [build-ios, build-android]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            --title "RTSP Camera $TAG" \
            --notes "Automated build from ${{ github.sha }}" \
            release/*
