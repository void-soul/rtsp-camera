plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.gld.rtsp_camera'
    compileSdk 36
    buildToolsVersion "36.0.0"
    
    defaultConfig {
        applicationId "com.gld.rtsp_camera"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0-native"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 支持 16 KB 页面对齐 (Android 15+ 兼容)
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    // Lint 配置
    lint {
        abortOnError false
        disable 'UnsafeOptInUsageError'
        baseline file("lint-baseline.xml")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference-ktx:1.2.0'
    
    // CameraX
    def camerax_version = "1.6.0"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    // 不引入 camera-extensions：它包含未对齐的 libimage_processing_util_jni.so
    // 且本应用不使用 CameraX 扩展功能（人像/夜景/HDR 预览等）
    
    implementation "com.google.guava:guava:31.1-android"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
